apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ai-dlc
  source:
    repoURL: https://github.com/esarath/AI_DLC-framework.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: webapp-prod
  syncPolicy:
    # Prod uses manual sync: the CD workflow gates on GitHub Environment
    # approval + Jira approval, then runs `argocd app sync webapp-prod`.
    automated: null
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 20 # deeper history = safer rollback
