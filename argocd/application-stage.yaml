apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp-stage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ai-dlc
  source:
    repoURL: https://github.com/esarath/AI_DLC-framework.git
    targetRevision: main
    path: k8s/overlays/stage
  destination:
    server: https://kubernetes.default.svc
    namespace: webapp-stage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
