name: Security — scheduled scans

on:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  k8s-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Render manifests
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          for env in dev stage prod; do
            ./kustomize build "k8s/overlays/${env}" > "/tmp/${env}.yaml"
          done

      # ---- guardrail: OPA policy checks against rendered manifests ----
      - name: Conftest (OPA) policy check
        uses: instrumenta/conftest-action@master
        with:
          files: /tmp/dev.yaml,/tmp/stage.yaml,/tmp/prod.yaml
          policy: policies/conftest

  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v3
