name: CI — build, test, scan, push

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"      # GitOps tag bumps are committed back by the CD job
      - "docs/**"

permissions:
  contents: write       # push GitOps image-tag bump back to main
  id-token: write       # Azure OIDC login
  security-events: write # upload SARIF
  pull-requests: write

env:
  IMAGE_NAME: webapp
  DEV_ACR: acraidlcdev.azurecr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint (syntax check)
        working-directory: app
        run: npm run lint

      - name: Unit tests
        working-directory: app
        run: npm test

  build-scan-push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        working-directory: app
        run: docker build -t "${DEV_ACR}/${IMAGE_NAME}:${{ steps.meta.outputs.tag }}" .

      # ---- guardrail: image vulnerability scan blocks the pipeline ----
      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "${{ env.DEV_ACR }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}"
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy.sarif
        continue-on-error: false

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

      # ---- push to dev ACR only from main ----
      - name: Azure login (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login + push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          az acr login --name "${DEV_ACR%%.*}"
          docker push "${DEV_ACR}/${IMAGE_NAME}:${{ steps.meta.outputs.tag }}"
          docker tag "${DEV_ACR}/${IMAGE_NAME}:${{ steps.meta.outputs.tag }}" \
                     "${DEV_ACR}/${IMAGE_NAME}:dev-latest"
          docker push "${DEV_ACR}/${IMAGE_NAME}:dev-latest"

      # ---- GitOps: bump the dev overlay tag; ArgoCD converges the cluster ----
      - name: Update dev overlay image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd k8s/overlays/dev
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          ./kustomize edit set image "ACLOGIN_SERVER_PLACEHOLDER/webapp=${DEV_ACR}/${IMAGE_NAME}:${{ steps.meta.outputs.tag }}"
          rm kustomize

      - name: Commit GitOps tag bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "ai-dlc-bot"
          git config user.email "ai-dlc-bot@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git commit -m "gitops(dev): webapp -> ${{ steps.meta.outputs.tag }} [skip ci]" || echo "no change"
          git push
