apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: webapp-stage

resources:
  - ../../base

commonLabels:
  environment: stage

patches:
  - path: patch-replicas.yaml

images:
  - name: ACLOGIN_SERVER_PLACEHOLDER/webapp
    newName: acraidlcstage.azurecr.io/webapp
    newTag: stage-latest # updated by the CD workflow on each promotion
